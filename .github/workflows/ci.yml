name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Bibliotecas del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libxcb-cursor0 libegl1 libxkbcommon0 libgl1
      - name: Instalar
        run: pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -v
      - name: Construir paquete
        run: |
          pip install build
          python -m build

  packaging:
    name: Packaging (shellcheck + version check)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shopt -s nullglob
          files=(packaging/*.sh packaging/test/*.sh)
          if [ "${#files[@]}" -eq 0 ]; then echo "no packaging scripts found" >&2; exit 1; fi
          shellcheck "${files[@]}"
      - name: Version and tag
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/mirada/__init__.py)"
          test -n "$version"
          echo "Version: $version"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version $version" >&2
            exit 1
          fi
          # The changelog should mention the current version
          grep -q "$version" CHANGELOG.md || echo "Note: CHANGELOG.md does not mention $version"
      - name: Desktop entry and AppStream metadata
        run: |
          sudo apt-get install -y --no-install-recommends appstream desktop-file-utils
          desktop-file-validate data/mirada.desktop
          appstreamcli validate --no-net data/io.github.jleiva831.mirada.metainfo.xml
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/mirada/__init__.py)"
          latest="$(grep -m1 -o '<release version="[^"]*"' data/io.github.jleiva831.mirada.metainfo.xml | cut -d '"' -f 2)"
          if [ "$latest" != "$version" ]; then
            echo "The latest <release> in the metainfo is $latest, but the version is $version" >&2
            exit 1
          fi
